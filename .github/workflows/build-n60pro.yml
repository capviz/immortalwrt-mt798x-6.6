name: Build ImmortalWrt N60 Pro 512MB

on:
  workflow_dispatch:

env:
  REPO_BRANCH: openwrt-24.10-6.6
  TARGET: mediatek
  SUBTARGET: filogic
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REPO_BRANCH }}

      - name: Init build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update -y
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 \
            libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch \
            pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons \
            squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget \
            xmlto xxd zlib1g-dev
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source
        working-directory: /workdir
        run: |
          git clone https://github.com/capviz/immortalwrt-mt798x-6.6 -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Update feeds
        working-directory: /workdir/openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate config
        working-directory: /workdir/openwrt
        run: |
          cat > .config << 'EOF'
CONFIG_TARGET_mediatek=y
CONFIG_TARGET_mediatek_filogic=y
CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60-pro=y
CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-base=y
CONFIG_PACKAGE_luci-compat=y
CONFIG_PACKAGE_luci-mod-admin-full=y
CONFIG_PACKAGE_luci-theme-bootstrap=y
CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
CONFIG_PACKAGE_kmod-mt7986-firmware=y
CONFIG_PACKAGE_kmod-mtd-rw=y
CONFIG_PACKAGE_mtd=y
EOF
          make defconfig

      - name: Download packages
        working-directory: /workdir/openwrt
        run: |
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        working-directory: /workdir/openwrt
        run: |
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s

      - name: Collect firmware
        run: |
          cd /workdir/openwrt/bin/targets/$TARGET/$SUBTARGET
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-N60Pro-512MB-${{ github.run_number }}
          path: |
            ${{ env.FIRMWARE }}/*squashfs-sysupgrade*
            ${{ env.FIRMWARE }}/*initramfs*
          retention-days: 7

      - name: Release firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: N60Pro-512MB-${{ github.run_number }}
          name: ImmortalWrt N60Pro 512MB Build ${{ github.run_number }}
          files: |
            ${{ env.FIRMWARE }}/*squashfs-sysupgrade*
            ${{ env.FIRMWARE }}/*initramfs*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
