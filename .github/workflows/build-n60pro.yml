name: Build ImmortalWrt N60 Pro 512MB

on:
  workflow_dispatch:
    inputs:
      config:
        description: '选择分区方案'
        required: true
        default: '506mb'
        type: choice
        options:
          - 506mb

env:
  REPO_URL: https://github.com/${{ github.repository }}
  REPO_BRANCH: openwrt-24.10-6.6
  TARGET: mediatek
  SUBTARGET: filogic
  PROFILE: netcore_n60-pro
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REPO_BRANCH }}

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update -y
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 \
            libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch \
            pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons \
            squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget \
            xmlto xxd zlib1g-dev
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 克隆源码
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 更新 feeds
        working-directory: /workdir/openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成编译配置
        working-directory: /workdir/openwrt
        run: |
          cat > .config << 'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60-pro=y

          # 基础功能
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y

          # 中文支持
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y

          # 无线
          CONFIG_PACKAGE_kmod-mt7986-firmware=y

          # 不编译 Docker
          # CONFIG_PACKAGE_luci-app-dockerman is not set
          # CONFIG_PACKAGE_dockerd is not set

          # 不编译 USB 存储相关
          # CONFIG_PACKAGE_kmod-usb-storage is not set
          # CONFIG_PACKAGE_kmod-usb-storage-extras is not set
          # CONFIG_PACKAGE_luci-app-usb-printer is not set

          # MTD 工具（用于刷写分区）
          CONFIG_PACKAGE_kmod-mtd-rw=y
          CONFIG_PACKAGE_mtd=y
          EOF
          make defconfig

      - name: 下载编译依赖包
        working-directory: /workdir/openwrt
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        working-directory: /workdir/openwrt
        run: |
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s

      - name: 整理固件文件
        run: |
          cd /workdir/openwrt/bin/targets/$TARGET/$SUBTARGET
          # 只保留需要的文件
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: 上传固件到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-N60Pro-512MB-${{ github.run_number }}
          path: |
            ${{ env.FIRMWARE }}/*squashfs-sysupgrade*
            ${{ env.FIRMWARE }}/*initramfs*
          retention-days: 7

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: N60Pro-512MB-${{ github.run_number }}
          name: ImmortalWrt N60Pro 512MB Build ${{ github.run_number }}
          files: |
            ${{ env.FIRMWARE }}/*squashfs-sysupgrade*
            ${{ env.FIRMWARE }}/*initramfs*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

